<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marketing Elitech</title>
<meta name="theme-color" content="#364fab">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png"> 
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marketing Elitech">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#364fab;--brand-dark:#2a3d87;--brand-fg:#ffffff;--brand-soft:#eef0f9;
    --surface:#f5f6f9;--border:#e6e8ee;--text:#14151a;--text-2:#6b7280;
    --tabbar-h:64px;--safe-b:env(safe-area-inset-bottom, 0px);
    --rail-w:88px;
    --morph:0.5s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;background:#fff;color:var(--text);}

  /* ================= SPLASH ================= */
  #splash{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--brand);transition:opacity var(--morph), transform var(--morph);
  }
  #splash.hide{opacity:0;transform:scale(1.06);pointer-events:none;}
  .splash-mark{font-size:30px;font-weight:800;letter-spacing:1.5px;color:#fff;opacity:0;transform:scale(.9);animation:splashIn .6s cubic-bezier(.2,.8,.2,1) .1s forwards;}
  .splash-tag{font-size:13px;font-weight:500;color:rgba(255,255,255,.72);letter-spacing:.3px;opacity:0;transform:translateY(4px);animation:splashTagIn .5s ease .35s forwards;}
  .splash-status{font-size:11.5px;font-weight:500;color:rgba(255,255,255,.55);letter-spacing:.3px;margin-top:2px;min-height:14px;opacity:0;animation:splashTagIn .5s ease .5s forwards;}
  .splash-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);animation:splashPulse 1.1s ease-in-out infinite;}
  @keyframes splashIn{to{opacity:1;transform:scale(1);}}
  @keyframes splashTagIn{to{opacity:1;transform:translateY(0);}}
  @keyframes splashPulse{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1);}}

  /* ================= APP SHELL ================= */
  #app{height:100%;opacity:0;transform:scale(.985);transition:opacity var(--morph), transform var(--morph);}
  #app.reveal{opacity:1;transform:scale(1);}
  #content{position:fixed;top:0;left:0;right:0;bottom:calc(var(--tabbar-h) + var(--safe-b));}

  .frame-wrap{
    position:absolute;inset:0;background:#fff;opacity:0;transform:scale(.985);pointer-events:none;z-index:1;
    transition:opacity var(--morph), transform var(--morph);
  }
  .frame-wrap.active{opacity:1;transform:scale(1);pointer-events:auto;z-index:2;}
  .tool-frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;}

  .frame-loading{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--text-2);font-size:13px;background:#fff;opacity:1;transition:opacity var(--morph);
  }
  .frame-wrap.loaded .frame-loading{opacity:0;pointer-events:none;}
  .spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--brand);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ================= TAB BAR (HP & tablet: di bawah) ================= */
  #tabbar{
    position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + var(--safe-b));padding-bottom:var(--safe-b);
    display:flex;background:#ffffff;border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(20,21,26,0.04);z-index:10;
  }
  #tabIndicator{position:absolute;top:6px;left:0;width:44px;height:36px;border-radius:12px;background:var(--brand-soft);transition:transform var(--morph);will-change:transform;}
  .tab-btn{
    position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--text-2);background:none;border:none;cursor:pointer;font-family:inherit;padding:6px 4px 0;height:var(--tabbar-h);z-index:1;
  }
  .tab-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--morph),color var(--morph);}
  .tab-btn span{font-size:11px;font-weight:500;transition:color var(--morph);}
  .tab-btn.active{color:var(--brand);}
  .tab-btn.active svg{transform:translateY(-1px) scale(1.08);}

  /* badge jumlah (mis. produk dibandingkan) di ikon tab */
  .tab-badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;display:none;box-shadow:0 0 0 2px #fff;}
  .tab-badge.show{display:block;}

  /* tombol Mode Presentasi (bukan tab, tidak punya halaman sendiri) */
  .act-btn{
    position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--text-2);background:none;border:none;cursor:pointer;font-family:inherit;padding:6px 4px 0;height:var(--tabbar-h);z-index:1;
  }
  .act-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .act-btn span{font-size:11px;font-weight:500;}
  .act-btn .ico-off{display:none;}
  .act-btn.on{color:#fff;}
  .act-btn.on::before{content:'';position:absolute;top:6px;left:50%;width:44px;height:36px;margin-left:-22px;border-radius:12px;background:var(--brand);z-index:-1;}
  .act-btn.on .ico-on{display:none;}
  .act-btn.on .ico-off{display:block;}
  .act-btn.on span{color:var(--brand);font-weight:600;}

  /* pesan kecil melayang: offline / versi baru / pasang aplikasi */
  #notice{
    position:fixed;left:50%;bottom:calc(var(--tabbar-h) + var(--safe-b) + 12px);transform:translate(-50%,12px);
    z-index:20;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);
    padding:10px 10px 10px 16px;border-radius:999px;background:#14151a;color:#fff;font-size:13px;font-weight:500;
    box-shadow:0 6px 20px rgba(20,21,26,.25);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
  }
  #notice.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  #notice button{border:none;border-radius:999px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:7px 14px;background:#fff;color:var(--brand);}
  #notice button.ghost{background:transparent;color:rgba(255,255,255,.7);padding:7px 8px;}

  /* ================= PC: sidebar di kiri ================= */
  @media (min-width:1024px) and (pointer:fine){
    #content{top:0;left:var(--rail-w);right:0;bottom:0;}

    #tabbar{
      top:0;bottom:0;left:0;right:auto;width:var(--rail-w);height:auto;
      flex-direction:column;align-items:stretch;justify-content:flex-start;
      padding:14px 0 0;border-top:none;border-right:1px solid var(--border);
      box-shadow:2px 0 10px rgba(20,21,26,0.04);
    }
    #tabbar::before{
      content:'';display:block;
      width:40px;height:40px;margin:0 auto 18px;border-radius:12px;
      background:url('icons/icon-192.png') center/cover no-repeat;flex:none;
    }
    #tabIndicator{top:0;left:0;width:60px;height:56px;border-radius:14px;}
    .tab-btn{flex:none;height:64px;padding:0;gap:4px;}
    .tab-btn span{font-size:11.5px;}
    .tab-btn:hover{color:var(--brand);}
    .tab-btn.active svg{transform:scale(1.08);}
    .tab-badge{top:8px;left:calc(50% + 8px);}
    .act-btn{flex:none;height:64px;padding:0;gap:4px;margin-top:auto;margin-bottom:14px;}
    .act-btn:hover{color:var(--brand);}
    .act-btn.on:hover{color:#fff;}
    .act-btn.on span{color:#fff;}
    .act-btn.on::before{top:4px;width:60px;height:56px;margin-left:-30px;border-radius:14px;}
    #notice{left:calc(var(--rail-w) + (100vw - var(--rail-w)) / 2);bottom:24px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-mark">ELITECH</div>
  <div class="splash-tag">Marketing</div>
  <div class="splash-dot"></div>
  <div class="splash-status" id="splashStatus">Memuat katalog…</div>
</div>

<div id="app">
  <div id="content">
    <div class="frame-wrap active" data-tool="katalog">
      <div class="frame-loading"><div class="spinner"></div>Memuat Katalog Produk…</div>
    </div>
    <div class="frame-wrap" data-tool="populasi">
      <div class="frame-loading"><div class="spinner"></div>Memuat Populasi Penjualan…</div>
    </div>
    <div class="frame-wrap" data-tool="peta">
      <div class="frame-loading"><div class="spinner"></div>Memuat Peta Distributor…</div>
    </div>
  </div>

  <nav id="tabbar">
    <div id="tabIndicator"></div>
    <button class="tab-btn active" data-tool="katalog">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Katalog</span>
      <b class="tab-badge" id="badgeKatalog"></b>
    </button>
    <button class="tab-btn" data-tool="populasi">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span>Populasi</span>
    </button>
    <button class="tab-btn" data-tool="peta">
      <svg viewBox="0 0 24 24"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>
      <span>Peta</span>
    </button>
    <button class="act-btn" id="presentBtn" aria-pressed="false" title="Mode Presentasi: sembunyikan harga internal">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.8C3.7 8.7 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      <span>Presentasi</span>
    </button>
  </nav>
  <div id="notice" role="status" aria-live="polite"></div>
</div>

<script>
  // GANTI dengan URL GitHub Pages masing-masing tool kalau berbeda dari ini.
  const TOOL_URLS = {
    katalog:  'https://markom-sudo.github.io/product/index.html',
    populasi: 'https://markom-sudo.github.io/Populasi/',
    peta:     'https://markom-sudo.github.io/PetaDistributor/index.html',
  };

  const READY_FALLBACK_MS = 8000;
  const MIN_SPLASH_MS = 700;
  const PRELOAD_DELAY_MS = 1200; // jeda setelah katalog siap, sebelum tab lain dimuat diam-diam

  const LS_TAB = 'elitech_tab', LS_PRES = 'elitech_presentasi';
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const wraps = {};
  document.querySelectorAll('.frame-wrap').forEach(w => wraps[w.dataset.tool] = w);
  const tabs = Array.from(document.querySelectorAll('.tab-btn'));
  const indicator = document.getElementById('tabIndicator');
  const splashStatus = document.getElementById('splashStatus');
  const DESKTOP_MQ = window.matchMedia('(min-width:1024px) and (pointer:fine)');
  let currentTool = 'katalog';
  const toolReady = { katalog: false, populasi: false, peta: false };
  const splashStart = Date.now();
  let splashRevealed = false;

  function moveIndicator(btn) {
    const barRect = btn.parentElement.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    if (DESKTOP_MQ.matches) {
      // PC (sidebar): indikator bergerak vertikal
      const x = (barRect.width - indicator.offsetWidth) / 2;
      const y = (btnRect.top - barRect.top) + (btnRect.height - indicator.offsetHeight) / 2;
      indicator.style.transform = `translate(${x}px, ${y}px)`;
    } else {
      // HP & tablet: indikator bergerak horizontal
      const x = (btnRect.left - barRect.left) + (btnRect.width - indicator.offsetWidth) / 2;
      indicator.style.transform = `translateX(${x}px)`;
    }
  }

  function ensureFrame(name) {
    const wrap = wraps[name];
    if (wrap.querySelector('iframe')) return;
    const iframe = document.createElement('iframe');
    iframe.className = 'tool-frame';
    iframe.src = TOOL_URLS[name];
    iframe.title = name;
    // Tab selain katalog: anggap siap begitu halamannya selesai dimuat
    // (katalog menunggu sinyal __elitechReady dari dalam, supaya splash
    // baru hilang setelah grid produk benar-benar tampil).
    if (name !== 'katalog') iframe.addEventListener('load', () => markReady(name));
    iframe.addEventListener('load', () => sendMode(name));
    wrap.appendChild(iframe);
    setTimeout(() => markReady(name), READY_FALLBACK_MS);
  }

  function markReady(name) {
    if (toolReady[name]) return;
    toolReady[name] = true;
    const wrap = wraps[name];
    if (wrap) wrap.classList.add('loaded');
    if (name === 'katalog') {
      revealApp();
      // Muat tab lain di belakang layar, jadi pindah tab nanti instan.
      setTimeout(preloadOtherTools, PRELOAD_DELAY_MS);
    }
  }

  function preloadOtherTools() {
    Object.keys(TOOL_URLS).forEach(ensureFrame);
  }

  /* ---------- Mode Presentasi: kabar ke semua tool ---------- */
  let presentasi = lsGet(LS_PRES) === '1';
  const presentBtn = document.getElementById('presentBtn');

  function frameOf(name) { const w = wraps[name]; return w && w.querySelector('iframe'); }
  function sendMode(name) {
    const f = frameOf(name);
    if (!f || !f.contentWindow) return;
    let origin = '*';
    try { origin = new URL(TOOL_URLS[name]).origin; } catch (e) {}
    f.contentWindow.postMessage({ __elitech: 'mode', presentasi: presentasi }, origin);
  }
  function applyPresentasi(on, silent) {
    presentasi = !!on;
    lsSet(LS_PRES, presentasi ? '1' : '0');
    presentBtn.classList.toggle('on', presentasi);
    presentBtn.setAttribute('aria-pressed', String(presentasi));
    Object.keys(TOOL_URLS).forEach(sendMode);
    if (!silent) flash(presentasi ? 'Mode Presentasi aktif: harga internal disembunyikan' : 'Mode Presentasi dimatikan');
  }
  presentBtn.addEventListener('click', () => applyPresentasi(!presentasi));

  /* ---------- pesan kecil melayang (offline / versi baru / pasang) ---------- */
  const noticeEl = document.getElementById('notice');
  const notices = { update: null, offline: false, install: null };   // prioritas: update > offline > install
  let flashTimer = null;
  function paintNotice() {
    if (flashTimer) return;                      // pesan sesaat sedang tampil
    let html = '', ok = true;
    if (notices.update)       html = 'Versi baru tersedia <button id="nUpdate">Muat ulang</button>';
    else if (notices.offline) html = 'Offline: menampilkan data tersimpan';
    else if (notices.install) html = 'Pasang aplikasi di perangkat <button id="nInstall">Pasang</button><button class="ghost" id="nClose" aria-label="Tutup">✕</button>';
    else ok = false;
    noticeEl.innerHTML = html;
    noticeEl.classList.toggle('show', ok);
    const u = document.getElementById('nUpdate'); if (u) u.onclick = applyUpdate;
    const i = document.getElementById('nInstall'); if (i) i.onclick = doInstall;
    const c = document.getElementById('nClose');  if (c) c.onclick = () => { lsSet('elitech_install_dismissed', '1'); notices.install = null; paintNotice(); };
  }
  function flash(msg) {
    clearTimeout(flashTimer);
    noticeEl.textContent = msg;
    noticeEl.classList.add('show');
    flashTimer = setTimeout(() => { flashTimer = null; noticeEl.classList.remove('show'); setTimeout(paintNotice, 260); }, 2200);
  }
  function setOffline() { notices.offline = !navigator.onLine; paintNotice(); }
  window.addEventListener('online', setOffline);
  window.addEventListener('offline', setOffline);

  // tombol "Pasang aplikasi" (Chrome/Edge/Android)
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    if (lsGet('elitech_install_dismissed') === '1') return;
    notices.install = e;
    paintNotice();
  });
  async function doInstall() {
    const e = notices.install; if (!e) return;
    notices.install = null; paintNotice();
    e.prompt();
    try { await e.userChoice; } catch (x) {}
  }
  window.addEventListener('appinstalled', () => { notices.install = null; paintNotice(); });

  // versi baru: sinyal datang dari sw.js (di shell sendiri, atau diteruskan tool lewat iframe)
  let reloading = false;
  function tawarkanUpdate() { notices.update = true; paintNotice(); }
  function applyUpdate() { if (!reloading) { reloading = true; location.reload(); } }

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data) return;
    // hanya terima pesan dari iframe tool kita sendiri
    const from = Object.keys(wraps).find(k => { const f = frameOf(k); return f && f.contentWindow === event.source; });
    if (!from) return;
    if (data.__elitechUpdate) tawarkanUpdate();
    if (typeof data.__elitechReady === 'string') {
      markReady(data.__elitechReady);
      sendMode(from);                            // tool baru siap -> beri tahu status presentasi
    }
    if (data.__elitechBadge && data.__elitechBadge.tool === 'katalog') {
      const n = Number(data.__elitechBadge.n) || 0, b = document.getElementById('badgeKatalog');
      b.textContent = n; b.classList.toggle('show', n > 0);
    }
  });

  function openTool(name) {
    if (name === currentTool && wraps[name].querySelector('iframe')) return;
    ensureFrame(name);

    tabs.forEach(t => {
      const active = t.dataset.tool === name;
      t.classList.toggle('active', active);
      if (active) moveIndicator(t);
    });

    Object.entries(wraps).forEach(([key, wrap]) => {
      wrap.classList.toggle('active', key === name);
    });

    currentTool = name;
    lsSet(LS_TAB, name);
    try { history.replaceState(history.state, '', '#' + name); } catch (e) {}
  }

  tabs.forEach(btn => btn.addEventListener('click', () => openTool(btn.dataset.tool)));
  window.addEventListener('resize', () => {
    const activeBtn = tabs.find(t => t.dataset.tool === currentTool);
    if (activeBtn) moveIndicator(activeBtn);
  });

  function revealApp() {
    if (splashRevealed) return;
    splashRevealed = true;
    const elapsed = Date.now() - splashStart;
    const wait = Math.max(0, MIN_SPLASH_MS - elapsed);
    setTimeout(() => {
      document.getElementById('splash').classList.add('hide');
      document.getElementById('app').classList.add('reveal');
      setTimeout(() => document.getElementById('splash').remove(), 550);
    }, wait);
  }

  setTimeout(() => {
    if (!toolReady.katalog) splashStatus.textContent = 'Memuat lebih lama dari biasanya…';
  }, 3000);

  ensureFrame('katalog');
  moveIndicator(tabs[0]);
  applyPresentasi(presentasi, true);
  setOffline();

  // buka tab terakhir / dari link (#peta)
  (function () {
    const h = location.hash.replace('#', ''), saved = lsGet(LS_TAB);
    const start = TOOL_URLS[h] ? h : (TOOL_URLS[saved] ? saved : 'katalog');
    if (start !== 'katalog') openTool(start);
  })();

  // Service worker: simpan semua file aplikasi di perangkat -> bisa dibuka
  // offline dan berikutnya tampil cepat seperti aplikasi native.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      const sudahTerkontrol = !!navigator.serviceWorker.controller;   // false = kunjungan pertama
      navigator.serviceWorker.register('sw.js').then(reg => {
        setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);   // cek sw.js baru tiap 30 menit
      }).catch(() => {});
      // sw.js memakai skipWaiting: versi baru langsung aktif -> tawarkan muat ulang
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (sudahTerkontrol) tawarkanUpdate(); });
      // sw.js melaporkan index.html shell berubah di server
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data && e.data.type === 'ELITECH_UPDATE') tawarkanUpdate();
      });
    });
  }
</script>
</body>
</html>
